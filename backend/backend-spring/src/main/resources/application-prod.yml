# Production profile. Every secret comes from the environment.
# Start with: --spring.profiles.active=prod
# Bind loopback by default so Nginx on the same host is the only public entry.

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:tron_ai}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        missing-queues-fatal: false

ollama:
  base-url: ${OLLAMA_BASE_URL}
  model: ${OLLAMA_MODEL:qwen3:8b}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}

stt:
  base-url: ${STT_BASE_URL}
  timeout-seconds: ${STT_TIMEOUT_SECONDS:30}

voicevox:
  base-url: ${VOICEVOX_BASE_URL}
  speaker-id: ${VOICEVOX_SPEAKER_ID:13}
  timeout-seconds: ${VOICEVOX_TIMEOUT_SECONDS:30}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:tron-ai-private}

jwt:
  secret: ${JWT_SECRET}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-days: ${JWT_REFRESH_DAYS:7}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cloud:
  ai:
    enabled: ${CLOUD_AI_ENABLED:false}
    provider: ${CLOUD_AI_PROVIDER:}
    api-key: ${CLOUD_AI_API_KEY:}
    base-url: ${CLOUD_AI_BASE_URL:}
    model-fast: ${CLOUD_AI_MODEL_FAST:}
    model-quality: ${CLOUD_AI_MODEL_QUALITY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.tronai: INFO
