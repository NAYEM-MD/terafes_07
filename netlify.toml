[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/discover"
  to = "/aimentor"
  status = 301

[[redirects]]
  from = "/discover/*"
  to = "/aimentor"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
